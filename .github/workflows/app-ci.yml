name: Application CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 381492170891.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Frontend
        run: |
          cd frontend
          docker build -t ${{ env.ECR_REGISTRY }}/frontend:latest --platform linux/amd64 .
          docker push ${{ env.ECR_REGISTRY }}/frontend:latest

      - name: Build, tag, and push Catalogue
        run: |
          cd catalogue
          docker build -t ${{ env.ECR_REGISTRY }}/catalogue:latest --platform linux/amd64 .
          docker push ${{ env.ECR_REGISTRY }}/catalogue:latest

      - name: Build, tag, and push Voting
        run: |
          cd voting
          docker build -t ${{ env.ECR_REGISTRY }}/voting:latest --platform linux/amd64 .
          docker push ${{ env.ECR_REGISTRY }}/voting:latest

      - name: Build, tag, and push Recommendation
        run: |
          cd recommendation
          docker build -t ${{ env.ECR_REGISTRY }}/recommendation:latest --platform linux/amd64 .
          docker push ${{ env.ECR_REGISTRY }}/recommendation:latest

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name prod-eks
          # Deploying using reorganized Helm charts
          helm upgrade --install frontend ./charts/frontend -n app
          helm upgrade --install catalogue ./charts/catalogue -n app
          helm upgrade --install voting ./charts/voting -n app
          helm upgrade --install recommendation ./charts/recommendation -n app

      - name: Send Email Notification (Success)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Github Action Build Success - ${{ github.repository }}
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
          body: |
            Build and Deployment for ${{ github.repository }} was successful.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}

      - name: Send Email Notification (Failure)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Github Action Build Failed - ${{ github.repository }}
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
          body: |
            Build and Deployment for ${{ github.repository }} failed.
            Please check the logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
