name: Application CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 381492170891.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Frontend
        run: |
          cd frontend
          docker build -t $ECR_REGISTRY/frontend:latest --platform linux/amd64 .
          docker push $ECR_REGISTRY/frontend:latest

      - name: Build, tag, and push Catalogue
        run: |
          cd catalogue
          docker build -t $ECR_REGISTRY/catalogue:latest --platform linux/amd64 .
          docker push $ECR_REGISTRY/catalogue:latest

      - name: Build, tag, and push Voting
        run: |
          cd voting
          docker build -t $ECR_REGISTRY/voting:latest --platform linux/amd64 .
          docker push $ECR_REGISTRY/voting:latest

      - name: Build, tag, and push Recommendation
        run: |
          cd recommendation
          docker build -t $ECR_REGISTRY/recommendation:latest --platform linux/amd64 .
          docker push $ECR_REGISTRY/recommendation:latest
